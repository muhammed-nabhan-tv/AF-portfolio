<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ss-bg)" rx="10"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#26262a" rx="10"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#18181c" rx="10"/>
  <circle cx="36" cy="28" r="6" fill="#7c9473"/>
  <circle cx="56" cy="28" r="6" fill="#44444a"/>
  <circle cx="76" cy="28" r="6" fill="#44444a"/>
  
  <text x="110" y="34" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="1.5">SQL WORKBENCH // SUPERSTORE 3NF NORMALIZATION &amp; REVENUE AUDIT</text>
  <rect x="980" y="16" width="184" height="24" rx="4" fill="#7c947322" stroke="#7c947355"/>
  <text x="1072" y="32" text-anchor="middle" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">POSTGRESQL &amp; MYSQL</text>

  <!-- KPI Cards -->
  <g transform="translate(40, 80)">
    <rect width="260" height="100" fill="#151519" stroke="#25252b" rx="8"/>
    <text x="20" y="32" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">DATA QUALITY SCORE</text>
    <text x="20" y="70" fill="#7c9473" font-family="'Anton', sans-serif" font-size="34" letter-spacing="1">97.4%</text>
    <text x="20" y="88" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="11">Raised from 72% baseline</text>
  </g>

  <g transform="translate(330, 80)">
    <rect width="260" height="100" fill="#151519" stroke="#25252b" rx="8"/>
    <text x="20" y="32" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">REDUNDANCY ELIMINATED</text>
    <text x="20" y="70" fill="#f2efe9" font-family="'Anton', sans-serif" font-size="34" letter-spacing="1">-30%</text>
    <text x="20" y="88" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11">Via 3NF relational design</text>
  </g>

  <g transform="translate(620, 80)">
    <rect width="260" height="100" fill="#151519" stroke="#25252b" rx="8"/>
    <text x="20" y="32" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">TOP 3 SEGMENT SHARE</text>
    <text x="20" y="70" fill="#ff4b1f" font-family="'Anton', sans-serif" font-size="34" letter-spacing="1">60.2%</text>
    <text x="20" y="88" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11">Corporate + Home Office</text>
  </g>

  <g transform="translate(910, 80)">
    <rect width="250" height="100" fill="#151519" stroke="#25252b" rx="8"/>
    <text x="20" y="32" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">DATASET SCALE</text>
    <text x="20" y="70" fill="#f2efe9" font-family="'Anton', sans-serif" font-size="34" letter-spacing="1">10,000+</text>
    <text x="20" y="88" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="11">Transactional line items</text>
  </g>

  <!-- 3NF Relational Schema Architecture (Left) -->
  <g transform="translate(40, 205)">
    <rect width="560" height="430" fill="#151519" stroke="#25252b" rx="8"/>
    <text x="24" y="36" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">3NF RELATIONAL ENTITY MODEL</text>
    <text x="24" y="56" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11">PostgreSQL schema eliminating repeating anomalies across 4 normalized tables</text>

    <!-- Table 1: customers -->
    <g transform="translate(30, 80)">
      <rect width="220" height="135" fill="#1b1b22" stroke="#2d2d38" rx="6"/>
      <rect width="220" height="30" fill="#252530" rx="6"/>
      <text x="12" y="20" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tbl_customers</text>
      <text x="12" y="50" fill="#ff4b1f" font-family="'JetBrains Mono', monospace" font-size="10">PK customer_id VARCHAR</text>
      <text x="12" y="70" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">customer_name TEXT</text>
      <text x="12" y="90" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">segment_id INT (FK)</text>
      <text x="12" y="110" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">country, city, state</text>
    </g>

    <!-- Table 2: products -->
    <g transform="translate(310, 80)">
      <rect width="220" height="135" fill="#1b1b22" stroke="#2d2d38" rx="6"/>
      <rect width="220" height="30" fill="#252530" rx="6"/>
      <text x="12" y="20" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tbl_products</text>
      <text x="12" y="50" fill="#ff4b1f" font-family="'JetBrains Mono', monospace" font-size="10">PK product_id VARCHAR</text>
      <text x="12" y="70" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">category VARCHAR</text>
      <text x="12" y="90" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">sub_category VARCHAR</text>
      <text x="12" y="110" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">unit_cost, price NUMERIC</text>
    </g>

    <!-- Linking lines -->
    <path d="M 140,215 L 140,260 L 260,260 L 260,280" fill="none" stroke="#7c9473" stroke-width="2"/>
    <path d="M 420,215 L 420,260 L 300,260 L 300,280" fill="none" stroke="#7c9473" stroke-width="2"/>

    <!-- Table 3: orders (Fact) -->
    <g transform="translate(140, 275)">
      <rect width="280" height="135" fill="#1b1b22" stroke="#ff4b1f66" stroke-width="1.5" rx="6"/>
      <rect width="280" height="30" fill="#ff4b1f22" rx="6"/>
      <text x="12" y="20" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tbl_orders (Central Fact)</text>
      <text x="12" y="50" fill="#ff4b1f" font-family="'JetBrains Mono', monospace" font-size="10">PK order_id VARCHAR</text>
      <text x="12" y="70" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="10">FK customer_id, product_id</text>
      <text x="12" y="90" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">order_date, ship_date</text>
      <text x="12" y="110" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">sales, profit, discount, quantity</text>
    </g>
  </g>

  <!-- SQL Revenue Query & Segment Analysis (Right) -->
  <g transform="translate(620, 205)">
    <rect width="540" height="430" fill="#151519" stroke="#25252b" rx="8"/>
    <text x="24" y="36" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">SEGMENT REVENUE SHARE &amp; SQL AUDIT</text>
    <text x="24" y="56" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11">Aggregated revenue contribution queries by customer tier</text>

    <!-- Bars for Segments -->
    <!-- Segment 1: Consumer -->
    <g transform="translate(24, 90)">
      <text x="0" y="16" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="11">1. Consumer Segment</text>
      <text x="490" y="16" text-anchor="end" fill="#ff4b1f" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">$1,161,401 (50.5%)</text>
      <rect x="0" y="26" width="490" height="12" rx="6" fill="#222228"/>
      <rect x="0" y="26" width="247" height="12" rx="6" fill="#ff4b1f"/>
    </g>

    <!-- Segment 2: Corporate -->
    <g transform="translate(24, 155)">
      <text x="0" y="16" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="11">2. Corporate Segment</text>
      <text x="490" y="16" text-anchor="end" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">$706,146 (30.7%)</text>
      <rect x="0" y="26" width="490" height="12" rx="6" fill="#222228"/>
      <rect x="0" y="26" width="150" height="12" rx="6" fill="#7c9473"/>
    </g>

    <!-- Segment 3: Home Office -->
    <g transform="translate(24, 220)">
      <text x="0" y="16" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="11">3. Home Office Segment</text>
      <text x="490" y="16" text-anchor="end" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">$429,653 (18.8%)</text>
      <rect x="0" y="26" width="490" height="12" rx="6" fill="#222228"/>
      <rect x="0" y="26" width="92" height="12" rx="6" fill="#8a8a85"/>
    </g>

    <!-- SQL Code snippet display -->
    <g transform="translate(24, 290)">
      <rect width="490" height="115" fill="#0d0d10" stroke="#25252b" rx="6"/>
      <text x="16" y="24" fill="#55555c" font-family="'JetBrains Mono', monospace" font-size="9">-- Optimized Window Aggregation Query</text>
      <text x="16" y="42" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="10">SELECT c.segment, SUM(o.sales) AS total_revenue,</text>
      <text x="16" y="60" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="10">       ROUND(100.0 * SUM(o.sales) / SUM(SUM(o.sales)) OVER(), 2) AS rev_share</text>
      <text x="16" y="78" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="10">FROM tbl_orders o JOIN tbl_customers c USING (customer_id)</text>
      <text x="16" y="96" fill="#ff4b1f" font-family="'JetBrains Mono', monospace" font-size="10">GROUP BY c.segment ORDER BY total_revenue DESC;</text>
    </g>
  </g>
</svg>
