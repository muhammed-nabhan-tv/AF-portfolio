<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="lr-moss-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#586b52"/>
      <stop offset="100%" stop-color="#7c9473"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#lr-bg)" rx="8"/>
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#26262a" rx="8"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" fill="#18181c" rx="8"/>
  <circle cx="28" cy="24" r="5" fill="#7c9473"/>
  <circle cx="44" cy="24" r="5" fill="#44444a"/>
  <circle cx="60" cy="24" r="5" fill="#44444a"/>
  
  <text x="88" y="29" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">LOGIROUTE // SUPPLY CHAIN INTELLIGENCE &amp; TELEMETRY</text>
  <rect x="660" y="14" width="114" height="20" rx="3" fill="#7c947322" stroke="#7c947355"/>
  <text x="717" y="28" text-anchor="middle" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">12 HUBS ONLINE</text>

  <!-- Metric 1 -->
  <g transform="translate(30, 68)">
    <rect width="220" height="85" fill="#151519" stroke="#25252b" rx="6"/>
    <text x="16" y="26" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">AVG FULFILLMENT TIME</text>
    <text x="16" y="58" fill="#f2efe9" font-family="'Anton', sans-serif" font-size="28" letter-spacing="1">18.4 HRS</text>
    <rect x="135" y="38" width="68" height="22" rx="3" fill="#7c947325"/>
    <text x="169" y="53" text-anchor="middle" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">↓ 22%</text>
  </g>

  <!-- Metric 2 -->
  <g transform="translate(290, 68)">
    <rect width="220" height="85" fill="#151519" stroke="#25252b" rx="6"/>
    <text x="16" y="26" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">STOCKOUT INCIDENTS</text>
    <text x="16" y="58" fill="#ff4b1f" font-family="'Anton', sans-serif" font-size="28" letter-spacing="1">04 TOTAL</text>
    <text x="16" y="74" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">-35% vs previous quarter</text>
  </g>

  <!-- Metric 3 -->
  <g transform="translate(550, 68)">
    <rect width="220" height="85" fill="#151519" stroke="#25252b" rx="6"/>
    <text x="16" y="26" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">ON-TIME ROUTE SLA</text>
    <text x="16" y="58" fill="#f2efe9" font-family="'Anton', sans-serif" font-size="28" letter-spacing="1">98.2%</text>
    <text x="16" y="74" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="10">Target: 95.0%</text>
  </g>

  <!-- Network Map & Route Visualization -->
  <g transform="translate(30, 175)">
    <rect width="420" height="245" fill="#151519" stroke="#25252b" rx="6"/>
    <text x="20" y="28" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">REGIONAL HUB TOPOLOGY</text>
    <text x="20" y="44" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="10">Real-time freight route interconnectivity &amp; load factor</text>

    <!-- Map Nodes and connecting lines -->
    <path d="M 70,120 L 160,90 L 260,110 L 350,85 L 290,180 L 190,195 L 70,120 Z" fill="none" stroke="#262630" stroke-width="2"/>
    <path d="M 160,90 L 190,195 M 260,110 L 190,195 M 260,110 L 290,180" fill="none" stroke="#262630" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Active freight pulses -->
    <line x1="70" y1="120" x2="160" y2="90" stroke="#7c9473" stroke-width="2.5"/>
    <line x1="160" y1="90" x2="260" y2="110" stroke="#7c9473" stroke-width="2.5"/>
    <line x1="260" y1="110" x2="350" y2="85" stroke="#ff4b1f" stroke-width="2.5"/>

    <!-- Nodes -->
    <circle cx="70" cy="120" r="7" fill="#151519" stroke="#7c9473" stroke-width="3"/>
    <circle cx="160" cy="90" r="9" fill="#151519" stroke="#7c9473" stroke-width="3"/>
    <circle cx="260" cy="110" r="11" fill="#7c9473"/>
    <circle cx="350" cy="85" r="8" fill="#ff4b1f"/>
    <circle cx="290" cy="180" r="7" fill="#151519" stroke="#7c9473" stroke-width="3"/>
    <circle cx="190" cy="195" r="8" fill="#151519" stroke="#7c9473" stroke-width="3"/>

    <!-- Hub Labels -->
    <text x="70" y="142" text-anchor="middle" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">HUB-01 (W)</text>
    <text x="160" y="75" text-anchor="middle" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">HUB-03 (NW)</text>
    <text x="260" y="94" text-anchor="middle" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CENTRAL</text>
    <text x="350" y="70" text-anchor="middle" fill="#ff4b1f" font-family="'JetBrains Mono', monospace" font-size="9">HUB-07 (ALERT)</text>
    <text x="290" y="202" text-anchor="middle" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">HUB-11 (SE)</text>
    <text x="190" y="217" text-anchor="middle" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">HUB-09 (SW)</text>

    <!-- Legend -->
    <rect x="20" y="222" width="8" height="8" rx="2" fill="#7c9473"/>
    <text x="34" y="230" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">Optimal</text>
    <rect x="90" y="222" width="8" height="8" rx="2" fill="#ff4b1f"/>
    <text x="104" y="230" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">Congested</text>
  </g>

  <!-- Hub Capacity Table -->
  <g transform="translate(470, 175)">
    <rect width="300" height="245" fill="#151519" stroke="#25252b" rx="6"/>
    <text x="18" y="28" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">WAREHOUSE CAPACITY UTILIZATION</text>
    
    <!-- Table Header -->
    <text x="18" y="55" fill="#55555c" font-family="'JetBrains Mono', monospace" font-size="9">FACILITY</text>
    <text x="140" y="55" fill="#55555c" font-family="'JetBrains Mono', monospace" font-size="9">CAPACITY</text>
    <text x="282" y="55" text-anchor="end" fill="#55555c" font-family="'JetBrains Mono', monospace" font-size="9">STATUS</text>
    <line x1="18" y1="62" x2="282" y2="62" stroke="#25252b"/>

    <!-- Row 1 -->
    <text x="18" y="85" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="10">Hub 03 - Dallas</text>
    <rect x="140" y="76" width="70" height="7" rx="3.5" fill="#222228"/>
    <rect x="140" y="76" width="62" height="7" rx="3.5" fill="#7c9473"/>
    <text x="282" y="85" text-anchor="end" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="9">88% OK</text>

    <!-- Row 2 -->
    <text x="18" y="118" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="10">Hub 07 - Atlanta</text>
    <rect x="140" y="109" width="70" height="7" rx="3.5" fill="#222228"/>
    <rect x="140" y="109" width="67" height="7" rx="3.5" fill="#ff4b1f"/>
    <text x="282" y="118" text-anchor="end" fill="#ff4b1f" font-family="'JetBrains Mono', monospace" font-size="9">96% CRIT</text>

    <!-- Row 3 -->
    <text x="18" y="151" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="10">Hub 01 - Seattle</text>
    <rect x="140" y="142" width="70" height="7" rx="3.5" fill="#222228"/>
    <rect x="140" y="142" width="45" height="7" rx="3.5" fill="#7c9473"/>
    <text x="282" y="151" text-anchor="end" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="9">64% OK</text>

    <!-- Row 4 -->
    <text x="18" y="184" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="10">Hub 11 - Chicago</text>
    <rect x="140" y="175" width="70" height="7" rx="3.5" fill="#222228"/>
    <rect x="140" y="175" width="53" height="7" rx="3.5" fill="#7c9473"/>
    <text x="282" y="184" text-anchor="end" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="9">75% OK</text>

    <!-- Summary Box -->
    <rect x="18" y="202" width="264" height="28" fill="#1b1b22" rx="4"/>
    <text x="28" y="220" fill="#f2efe9" font-family="'JetBrains Mono', monospace" font-size="9">DAX BOTTLENECK ENGINE:</text>
    <text x="274" y="220" text-anchor="end" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="9">AUTO-REROUTE ON</text>
  </g>
</svg>
