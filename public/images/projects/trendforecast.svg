    <text x="212" y="105" text-anchor="end" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">+18%</text>
    <rect x="18" y="113" width="194" height="8" rx="4" fill="#222228"/>
