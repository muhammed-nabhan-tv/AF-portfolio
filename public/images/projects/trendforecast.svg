    <text x="18" y="202" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">REGRESSORS: Holiday + Promo</text>
    <text x="18" y="218" fill="#8a8a85" font-family="'JetBrains Mono', monospace" font-size="9">INTERVAL: 95% Bayesian</text>
    <text x="18" y="234" fill="#7c9473" font-family="'JetBrains Mono', monospace" font-size="9">STATUS: Syncing BigQuery</text>
