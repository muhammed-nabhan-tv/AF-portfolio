    <rect x="235" y="60" width="50" height="15" rx="3" fill="#ff4b1f"/>
    <text x="260" y="71" text-anchor="middle" fill="#0b0b0d" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">TODAY</text>

    <!-- X labels -->
